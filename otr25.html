<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan on the Road - California, Arizona, Utah, Nevada 2025</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        html { scroll-behavior: smooth; }
        /* Sfondo granulare coerente con la Home Page */
        body {
            margin: 0;
            padding: 0;
            background-color: #141618;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.022'/%3E%3C/svg%3E");
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #ffffff;
        }

        /* Tasto Back minimale per tornare alla Home */
        .back-nav {
            padding: 30px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .back-link:hover { color: #ffffff; }
        .back-link svg { width: 12px; height: 12px; fill: currentColor; }

        /* Intestazione del Viaggio */
        .travel-header { text-align: center; padding: 20px 20px 60px 20px; }
        .travel-header h1 { margin: 0; font-size: 2.4rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
        .travel-header .meta-info { margin-top: 12px; font-size: 0.85rem; color: rgba(255, 255, 255, 0.4); letter-spacing: 2px; text-transform: uppercase; }

        /* Linea di divisione strutturale elegante */
        .structural-line { width: calc(100% - 80px); max-width: 1400px; height: 1px; background-color: rgba(255, 255, 255, 0.05); margin: 0 auto; }

        /* Contenitore della Timeline del Diario */
        .timeline-container { max-width: 1100px; margin: 0 auto; padding: 60px 40px; }

        /* Blocco del Singolo Giorno */
        .day-block { display: grid; grid-template-columns: 180px 1fr; gap: 40px; margin-bottom: 80px; }
        .day-sticky { position: sticky; top: 40px; height: fit-content; }
        .day-number { font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; color: #ffffff; }
        .day-title { font-size: 0.8rem; font-weight: 500; color: rgba(255, 255, 255, 0.4); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
        .day-date { font-size: 0.75rem; color: rgba(255, 255, 255, 0.3); margin-top: 4px; letter-spacing: 1px; }

        /* Contenuto del Giorno (Colonna Destra) */
        .day-content { display: flex; flex-direction: column; gap: 30px; text-align: left; }
        .day-text { font-size: 0.95rem; line-height: 1.8; color: rgba(255, 255, 255, 0.75); margin: 0; font-weight: 400; }

        /* Box Dati di Viaggio */
        .day-details { display: flex; flex-wrap: wrap; gap: 20px 30px; border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); padding: 15px 0; width: 100%; }
        .detail-item { font-size: 0.75rem; letter-spacing: 1px; color: rgba(255,255,255,0.4); text-transform: uppercase; }

        /* Struttura delle righe flex per le foto del diario (generate da auto-layout.js) */
        .universal-media-wrapper { display: flex; flex-direction: column; gap: 20px; margin-top: 15px; width: 100%; }
        .universal-flex-row { display: flex; justify-content: center; align-items: center; gap: 20px; width: 100%; flex-wrap: wrap; }

        /* Cornice e miniature fisse extra-large */
        .photo-container-frame { margin: 0; box-sizing: border-box; border: 1px solid rgba(255, 255, 255, 0.15); padding: 6px; background-color: rgba(255, 255, 255, 0.03); border-radius: 4px; display: flex; flex-direction: column; justify-content: space-between; transition: border-color 0.3s ease, background-color 0.3s ease; }
        .photo-container-frame:hover { border-color: rgba(255, 255, 255, 0.4); background-color: rgba(255, 255, 255, 0.08); }
        .photo-container-frame img { width: 100%; object-fit: cover; display: block; border-radius: 2px; cursor: pointer; }

        /* Didascalia foto */
        .photo-caption { font-size: 0.75rem; color: rgba(255, 255, 255, 0.5); margin-top: 12px; font-style: italic; text-align: center; }

        .size-verticale { width: 180px; }
        .size-verticale img { height: 240px; }
        .size-orizzontale { width: 250px; }
        .size-orizzontale img { height: 188px; }
        .size-panoramica { width: 100%; }
        .size-panoramica img { height: 350px; }

        /* Nota "in preparazione" per i giorni ancora da riempire */
        .coming-soon { text-align: center; padding: 40px 20px 20px 20px; color: rgba(255, 255, 255, 0.35); font-size: 0.85rem; letter-spacing: 1px; font-style: italic; }

        /* Footer coordinato */
        .site-footer { max-width: 1100px; width: calc(100% - 80px); margin: 60px auto 20px auto; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }
        .footer-copyright { font-size: 0.75rem; color: rgba(255, 255, 255, 0.3); letter-spacing: 1px; text-transform: uppercase; }

        /* Torna all'inizio / Torna alla Home */
        .end-nav { max-width: 1100px; width: calc(100% - 80px); margin: 40px auto 0 auto; display: flex; gap: 30px; justify-content: center; }
        .end-nav-link { display: flex; align-items: center; gap: 8px; color: rgba(255, 255, 255, 0.5); font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; text-decoration: none; transition: color 0.2s ease; }
        .end-nav-link:hover { color: #ffffff; }
        .end-nav-link svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* Mappa del viaggio */
        .trip-map-section { max-width: 1100px; width: calc(100% - 80px); margin: 20px auto 0 auto; }
        .trip-map-title { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; color: #ffffff; margin-bottom: 4px; }
        .trip-map-subtitle { font-size: 0.8rem; color: rgba(255, 255, 255, 0.4); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 24px; }
        #trip-map { width: 100%; height: 560px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, 0.15); }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background-color: #1c1f22; color: #ffffff; }
        .leaflet-popup-content { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 0.8rem; letter-spacing: 0.5px; margin: 8px 12px; }
        .leaflet-popup-content b { display: block; margin-bottom: 2px; }
        .leaflet-popup-content span { color: rgba(255,255,255,0.5); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
        .trip-map-marker { width: 14px; height: 14px; background-color: #2a9d8f; border: 2px solid #141618; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,0.4); }
        .trip-map-label { background: rgba(20, 22, 24, 0.85); border: 1px solid rgba(255,255,255,0.15); color: #ffffff; font-size: 0.7rem; letter-spacing: 0.5px; padding: 2px 7px; border-radius: 3px; white-space: nowrap; box-shadow: none; }
        .trip-map-label::before { display: none; }
        .leaflet-control-attribution { background-color: rgba(20, 22, 24, 0.8) !important; color: rgba(255,255,255,0.4) !important; }
        .leaflet-control-attribution a { color: rgba(255,255,255,0.6) !important; }
        .leaflet-control-zoom a { background-color: #1c1f22 !important; color: #ffffff !important; border-color: rgba(255,255,255,0.15) !important; }
        .leaflet-control-zoom a:hover { background-color: #2a2e32 !important; }
        .footer-socials { display: flex; align-items: center; gap: 15px; }
        .social-icon { color: rgba(255, 255, 255, 0.3); transition: color 0.3s ease; display: inline-flex; }
        .social-icon:hover { color: #ffffff; }
        .social-icon svg { width: 16px; height: 16px; fill: currentColor; }

        /* Interfaccia Lightbox con supporto Zoom attivo */
        .lightbox-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(20, 22, 24, 0.98); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .lightbox-image-container { max-width: 90%; max-height: 75vh; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px; background-color: rgba(255, 255, 255, 0.03); border-radius: 4px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); position: relative; }
        .lightbox-image { max-width: 100%; max-height: 75vh; object-fit: contain; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); cursor: zoom-in; user-select: none; }
        .lightbox-image.is-zoomed { transform: scale(1.8); cursor: zoom-out; }
        .lightbox-close { position: absolute; top: 30px; right: 40px; color: rgba(255, 255, 255, 0.5); font-size: 2.5rem; font-family: Arial, sans-serif; cursor: pointer; transition: color 0.3s ease; line-height: 1; user-select: none; z-index: 10002; }
        .lightbox-close:hover { color: #ffffff; }
        .lightbox-prev, .lightbox-next { position: absolute; top: 50%; transform: translateY(-50%); color: rgba(255, 255, 255, 0.4); font-size: 3rem; cursor: pointer; transition: color 0.3s ease; user-select: none; padding: 20px; z-index: 10001; }
        .lightbox-prev:hover, .lightbox-next:hover { color: #ffffff; }
        .lightbox-prev { left: 20px; } .lightbox-next { right: 20px; }
        .lightbox-caption { color: #ffffff; font-size: 0.85rem; margin-top: 20px; letter-spacing: 1px; font-style: italic; text-align: center; max-width: 80%; }

        @media (max-width: 900px) {
            .day-block { grid-template-columns: 1fr; gap: 20px; margin-bottom: 60px; }
            .day-sticky { position: relative; top: 0; }
            .universal-flex-row { justify-content: center; }
            .size-verticale, .size-orizzontale { width: 44%; }
            .photo-container-frame img { height: auto !important; aspect-ratio: 3/4; }
            .size-orizzontale img { aspect-ratio: 4/3; }
            .size-panoramica { width: 100%; }
            .size-panoramica img { aspect-ratio: 16/9; }
            .lightbox-prev, .lightbox-next { font-size: 2rem; padding: 10px; }
            .lightbox-prev { left: 5px; } .lightbox-next { right: 5px; }
        }
    </style>
</head>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Ripeto il setup del lightbox DOPO che auto-layout.js ha già
            // iniettato le foto (i due script sopra girano prima di questo).
            const images = Array.from(document.querySelectorAll(".photo-container-frame img"));
            const lightbox = document.getElementById("lightbox");
            const lightboxImg = document.getElementById("lightbox-img");
            const lightboxClose = document.getElementById("lightbox-close");
            const lightboxCaption = document.getElementById("lightbox-caption");
            const prevBtn = document.getElementById("lightbox-prev");
            const nextBtn = document.getElementById("lightbox-next");

            let currentIndex = 0;

            function openLightbox(index) {
                currentIndex = index;
                const img = images[currentIndex];
                lightboxImg.src = img.src;
                lightboxImg.classList.remove("is-zoomed");

                const figcaption = img.closest(".photo-container-frame").querySelector("figcaption");
                lightboxCaption.textContent = figcaption ? figcaption.textContent : "";

                lightbox.style.display = "flex";
                document.body.style.overflow = "hidden";
            }

            function closeLightbox() {
                lightbox.style.display = "none";
                lightboxImg.classList.remove("is-zoomed");
                document.body.style.overflow = "auto";
            }

            function showPrev() {
                lightboxImg.classList.remove("is-zoomed");
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                openLightbox(currentIndex);
            }

            function showNext() {
                lightboxImg.classList.remove("is-zoomed");
                currentIndex = (currentIndex + 1) % images.length;
                openLightbox(currentIndex);
            }

            lightboxImg.addEventListener("click", function(e) {
                e.stopPropagation();
                this.classList.toggle("is-zoomed");
            });

            images.forEach((img, index) => {
                img.addEventListener("click", function() {
                    openLightbox(index);
                });
            });

            lightboxClose.addEventListener("click", closeLightbox);
            prevBtn.addEventListener("click", function(e) { e.stopPropagation(); showPrev(); });
            nextBtn.addEventListener("click", function(e) { e.stopPropagation(); showNext(); });
            lightbox.addEventListener("click", closeLightbox);

            document.addEventListener("keydown", function(e) {
                if (lightbox.style.display === "flex") {
                    if (e.key === "Escape") closeLightbox();
                    if (e.key === "ArrowLeft") showPrev();
                    if (e.key === "ArrowRight") showNext();
                }
            });
        });
    </script>

    <!-- ===== MAPPA DEL VIAGGIO (Leaflet.js) ===== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const tappe = [
                { nome: "Los Angeles", nota: "Partenza", lat: 34.0522, lng: -118.2437 },
                { nome: "Joshua Tree National Park", nota: "", lat: 33.8734, lng: -115.9010 },
                { nome: "Barstow", nota: "", lat: 34.8958, lng: -117.0173 },
                { nome: "Kingman", nota: "", lat: 35.1894, lng: -114.0530 },
                { nome: "Grand Canyon", nota: "", lat: 36.0544, lng: -112.1401 },
                { nome: "Meteor Crater", nota: "", lat: 35.0275, lng: -111.0223 },
                { nome: "Painted Desert", nota: "", lat: 35.0806, lng: -109.7862 },
                { nome: "Petrified Forest", nota: "", lat: 34.9058, lng: -109.8064 },
                { nome: "Page", nota: "", lat: 36.9147, lng: -111.4558 },
                { nome: "Monument Valley", nota: "", lat: 36.9385, lng: -110.0916 },
                { nome: "Canyonlands National Park", nota: "", lat: 38.3269, lng: -109.8783 },
                { nome: "Moab", nota: "", lat: 38.5733, lng: -109.5498 },
                { nome: "Arches National Park", nota: "", lat: 38.7331, lng: -109.5925 },
                { nome: "Las Vegas", nota: "", lat: 36.1699, lng: -115.1398 },
                { nome: "Death Valley", nota: "", lat: 36.5054, lng: -117.0794 },
                { nome: "Sequoia National Park", nota: "", lat: 36.4864, lng: -118.5658 },
                { nome: "Yosemite", nota: "", lat: 37.8651, lng: -119.5383 },
                { nome: "San Francisco", nota: "", lat: 37.7749, lng: -122.4194 },
                { nome: "Monterey", nota: "", lat: 36.6002, lng: -121.8947 },
                { nome: "Carmel", nota: "", lat: 36.5552, lng: -121.9233 },
                { nome: "Los Angeles", nota: "Rientro", lat: 34.0522, lng: -118.2437 }
            ];

            const map = L.map('trip-map', { scrollWheelZoom: false }).setView([36.5, -115.5], 5);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
                maxZoom: 19
            }).addTo(map);

            // Layer di riferimento: confini di stato/contea e nomi città, trasparente sopra il satellite
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 19
            }).addTo(map);

            const puntoIcon = L.divIcon({ className: 'trip-map-marker', iconSize: [14, 14] });

            const percorso = tappe.map(t => [t.lat, t.lng]);
            L.polyline(percorso, {
                color: '#2a9d8f',
                weight: 4,
                opacity: 0.9
            }).addTo(map);

            tappe.forEach(t => {
                L.marker([t.lat, t.lng], { icon: puntoIcon })
                    .addTo(map)
                    .bindTooltip(t.nome, { permanent: true, direction: 'top', offset: [0, -8], className: 'trip-map-label' })
                    .bindPopup(`<b>${t.nome}</b>${t.nota ? '<span>' + t.nota + '</span>' : ''}`);
            });

            map.fitBounds(L.latLngBounds(percorso), { padding: [30, 30] });
        });
    </script>
