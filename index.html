<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111820">
  <title>Dan On The Road</title>
  <style>
    :root{color-scheme:dark;--cream:#fff2dc}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#111820;color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,sans-serif;overflow:hidden}
    .hero{position:relative;height:100%;min-height:420px;isolation:isolate;background:#1a2026;display:grid;place-items:center;overflow:hidden}
    .hero::before{content:"";position:absolute;inset:-20px;background:url('home-dan-on-the-road.png') center/cover no-repeat;z-index:-3;filter:blur(24px) brightness(.45);transform:scale(1.08)}
    .hero::after{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(4,11,18,.48),transparent 25%,transparent 68%,rgba(4,10,16,.7)),linear-gradient(90deg,rgba(3,9,15,.28),transparent 22%,transparent 78%,rgba(3,9,15,.22));pointer-events:none}
    .top{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:clamp(20px,3vw,40px) clamp(22px,4vw,64px)}
    .brand{font-family:Georgia,serif;letter-spacing:.17em;font-size:.9rem;text-transform:uppercase;text-shadow:0 2px 18px #000}.eyebrow{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,242,220,.76)}
    .visual{position:relative;width:min(100vw,calc(100vh * 1.3407));aspect-ratio:1456/1086;animation:arrival 1.3s cubic-bezier(.2,.75,.25,1) both;box-shadow:0 32px 110px rgba(0,0,0,.52)}
    .visual img{display:block;width:100%;height:100%;object-fit:contain}
    .choice{position:absolute;inset:0}.choice a{position:absolute;top:41.25%;height:4.55%;overflow:hidden;border:0;border-radius:clamp(7px,1.2vw,18px);background:rgba(255,255,255,.015);color:transparent;cursor:pointer;transition:.2s ease;animation:button-call 2.8s ease-in-out infinite}
    .choice a::after{content:"";position:absolute;inset:-45% auto -45% -45%;width:28%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.72),transparent);transform:skewX(-18deg);animation:button-shine 3.6s ease-in-out infinite}
    .choice a:hover,.choice a:focus-visible{outline:0;box-shadow:0 0 22px rgba(255,222,174,.62),0 10px 28px rgba(0,0,0,.36);transform:translateY(-2px);animation-play-state:paused}
    .choice a:active{transform:scale(.98)}.it{left:36.25%;width:11.7%}.en{left:48.9%;width:11%;animation-delay:1.4s}.en::after{animation-delay:1.8s}
    @keyframes arrival{from{transform:scale(1.045);filter:brightness(.55)}to{transform:scale(1);filter:brightness(1)}}@keyframes button-call{0%,100%{box-shadow:0 0 0 rgba(255,240,214,0)}18%{box-shadow:0 0 24px rgba(255,215,158,.58)}36%{box-shadow:0 0 0 rgba(255,240,214,0)}}@keyframes button-shine{0%,42%{left:-45%;opacity:0}52%{opacity:1}66%,100%{left:125%;opacity:0}}
    @media(prefers-reduced-motion:reduce){.visual,.choice a,.choice a::after{animation:none}.choice a{box-shadow:0 0 18px rgba(255,220,170,.34)}}
    @media(max-width:620px){.eyebrow{display:none}.brand{margin-left:auto}.visual{width:100vw}}
  </style>
</head>
<body>
  <main class="hero">
    <header class="top"><span class="brand">Dan On The Road</span><span class="eyebrow">Diari di viaggio · Travel journals</span></header>
    <div class="visual">
      <img src="home-dan-on-the-road.png" alt="Il salotto di Dan On The Road con fotografie di viaggio e una valigia blu">
      <nav class="choice" aria-label="Scegli la lingua · Choose your language">
        <a class="it" href="index-it.html" lang="it" aria-label="Entra nel sito in italiano">ITALIANO</a>
        <a class="en" href="index-en.html" lang="en" aria-label="Enter the website in English">ENGLISH</a>
      </nav>
    </div>
  </main>
</body>
</html>
